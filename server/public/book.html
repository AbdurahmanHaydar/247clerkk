<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book your onboarding — 247clerk</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%2310221C'/%3E%3Ccircle%20cx='32'%20cy='29'%20r='11'%20fill='%231FA855'/%3E%3Crect%20x='20'%20y='46'%20width='24'%20height='4'%20rx='2'%20fill='%235ED694'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#10221C;--paper:#F6F7F2;--card:#fff;--green:#1FA855;--green-dark:#158040;--muted:#5C6B63;--line:#DDE2DA}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Spline Sans',sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;
  min-height:100vh;display:grid;place-items:center;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:40px;max-width:520px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:9px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
  font-size:19px;text-decoration:none;margin-bottom:22px}
.logo .dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(31,168,85,.16)}
h1{font-family:'Bricolage Grotesque',sans-serif;font-size:29px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
p{color:var(--muted);margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:9px;background:var(--green);color:#fff;text-decoration:none;
  font-weight:600;padding:13px 24px;border-radius:999px;margin-top:24px;transition:background .18s ease}
.btn:hover{background:var(--green-dark)}
.back{display:block;margin-top:18px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
  <div class="card">
    <a class="logo" href="https://247clerk.com/"><span class="dot"></span>247clerk</a>
    <h1>Let's get your clerk on your own number.</h1>
    <p>Fifteen minutes is all it takes: we connect your WhatsApp number, set the questions your practice actually asks, and hand it over.</p>
    <a class="btn" href="mailto:admin@247clerk.com?subject=247clerk%20onboarding">Email us to book</a>
    <a class="back" href="https://247clerk.com/">← Back to 247clerk.com</a>
  </div>
</body>
</html>
