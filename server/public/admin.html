<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — 247clerk</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%2310221C'/%3E%3Ccircle%20cx='32'%20cy='29'%20r='11'%20fill='%231FA855'/%3E%3Crect%20x='20'%20y='46'%20width='24'%20height='4'%20rx='2'%20fill='%235ED694'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Spline+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10221C; --paper:#F6F7F2; --card:#FFFFFF; --green:#1FA855; --green-dark:#158040;
  --bubble:#E4F6E8; --amber:#B8791F; --muted:#5C6B63; --line:#DDE2DA; --night:#0C1714;
  --radius:14px; --display:'Bricolage Grotesque',sans-serif; --body:'Spline Sans',sans-serif;
  --mono:'Spline Sans Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.6;font-size:15px}
a{color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}

header{border-bottom:1px solid var(--line);background:var(--night);color:#EAF1EC;position:sticky;top:0;z-index:20}
.head-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:18px;text-decoration:none}
.logo .dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(31,168,85,.18)}
.logo .tag{font-family:var(--mono);font-size:11px;font-weight:400;text-transform:uppercase;letter-spacing:.12em;
  color:#9FB3A7;border:1px solid #2A3B34;border-radius:999px;padding:2px 9px;margin-left:4px}
.head-actions{display:flex;align-items:center;gap:14px;font-size:13.5px}
.head-actions a{color:#9FB3A7;text-decoration:none;font-family:var(--mono);font-size:12px;
  text-transform:uppercase;letter-spacing:.07em}
.head-actions a:hover{color:#fff}
.live{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:#9FB3A7;
  text-transform:uppercase;letter-spacing:.07em}
.live .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.82)}}

main{padding:26px 0 60px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .n{font-family:var(--display);font-size:27px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.stat .k{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px}

.tabs{display:flex;gap:8px;margin:24px 0 14px;flex-wrap:wrap;align-items:center}
.tab{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-family:var(--body);
  font-size:13.5px;color:var(--muted);cursor:pointer;transition:.15s ease}
.tab:hover{border-color:var(--muted)}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.search{margin-left:auto;flex:1;min-width:180px;max-width:300px;border:1px solid var(--line);border-radius:999px;
  padding:8px 15px;font-family:var(--body);font-size:14px;background:var(--card);color:var(--ink)}
.search:focus{outline:2px solid var(--bubble);border-color:var(--green)}

.split{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.panel-head{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;gap:12px}
.panel-head h2{font-family:var(--display);font-size:15px;font-weight:600}
.panel-head .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

.people{max-height:74vh;overflow-y:auto}
.person{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);
  padding:13px 18px;cursor:pointer;font-family:var(--body);font-size:15px;color:var(--ink);transition:background .12s ease}
.person:hover{background:#FBFCF9}
.person.on{background:var(--bubble)}
.person .row1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.person .who{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .num{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:1px}
.person .row2{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12px;color:var(--muted);
  font-family:var(--mono);flex-wrap:wrap}

.dot-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:11px;
  font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.dot-pill.qualified{background:var(--green);color:#fff}
.dot-pill.unqualified{background:#E9EBE5;color:var(--muted)}
.dot-pill.needs_info{background:#FBF0DC;color:var(--amber)}
.dot-pill.none{background:#E9EBE5;color:var(--muted)}
.dot-pill.open{background:#E9EBE5;color:var(--muted)}
.dot-pill.closed{background:#E9EBE5;color:var(--muted)}
.dot-pill.blocked{background:#F6DCDC;color:#9B2C2C}

.detail{padding:20px;max-height:74vh;overflow-y:auto}
.detail h3{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.01em}
.detail .phone{font-family:var(--mono);font-size:14px;color:var(--muted);margin-top:2px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.copy{background:none;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-family:var(--mono);
  font-size:11px;color:var(--muted);cursor:pointer}
.copy:hover{border-color:var(--muted);color:var(--ink)}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px 20px;margin:18px 0 4px;
  padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fact .label{display:block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted)}
.fact .value{font-size:14.5px;word-break:break-word}
.fact .value.empty{color:var(--muted);font-style:italic}

.section-title{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
  margin:24px 0 10px;display:flex;align-items:center;gap:10px}
.section-title::after{content:'';flex:1;height:1px;background:var(--line)}

.convo{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.convo-head{padding:10px 15px;background:#FBFCF9;border-bottom:1px solid var(--line);display:flex;
  align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);
  font-size:11.5px;color:var(--muted)}
.thread{padding:16px;display:flex;flex-direction:column;gap:10px;background:#FBFCF9}
.msg{max-width:78%;padding:9px 13px;border-radius:14px;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
.msg.in{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.out{align-self:flex-end;background:var(--bubble);border-bottom-right-radius:4px}
.msg time{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px}
.msg .flag{font-family:var(--mono);font-size:10px;color:var(--amber)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  text-align:left;font-weight:500;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
.mono{font-family:var(--mono);font-size:12.5px}
.dim{color:var(--muted)}

details{margin-top:8px}
summary{cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
summary:hover{color:var(--ink)}
pre{font-family:var(--mono);font-size:11.5px;background:#FBFCF9;border:1px solid var(--line);border-radius:8px;
  padding:11px;overflow-x:auto;margin-top:8px;white-space:pre-wrap;word-break:break-word}

.empty{color:var(--muted);text-align:center;padding:44px 20px;font-size:14.5px}
.hidden{display:none !important}
.scroll-x{overflow-x:auto}
@media (max-width:900px){
  .split{grid-template-columns:1fr}
  .people{max-height:340px}
  .detail{max-height:none}
}

/* ================================ flow builder ================================ */

.flowbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.flowbar select,.flowbar input{font-family:var(--body);font-size:14px;color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-radius:9px;padding:7px 11px}
.flowbar input{min-width:190px}
.flowbar .grow{flex:1}
.btn{font-family:var(--body);font-size:13.5px;border-radius:999px;padding:7px 16px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink);transition:.15s ease}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--green-dark);border-color:var(--green-dark)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.tiny{padding:3px 10px;font-size:12px}
.src-pill{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  border-radius:999px;padding:3px 10px;background:#E9EBE5;color:var(--muted)}
.src-pill.legacy{background:#FBF0DC;color:var(--amber)}
.src-pill.flow{background:var(--bubble);color:var(--green-dark)}

.problems{border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;font-size:14px}
.problems.error{background:#FCEDED;border:1px solid #E7BDBD;color:#8C2F2F}
.problems.warn{background:#FBF0DC;border:1px solid #E6D2A8;color:var(--amber)}
.problems.ok{background:var(--bubble);border:1px solid #BFE4CB;color:var(--green-dark)}
.problems ul{margin:6px 0 0 18px}

.steps{padding:12px;display:flex;flex-direction:column;gap:9px;max-height:70vh;overflow-y:auto}
.step{border:1px solid var(--line);border-radius:11px;background:var(--card)}
.step.dragging{opacity:.4}
.step.drop-before{box-shadow:0 -3px 0 var(--green)}
.step-head{display:flex;align-items:center;gap:9px;padding:10px 12px;cursor:pointer}
.step-head .grip{cursor:grab;color:#B6C0B8;font-size:15px;line-height:1;user-select:none}
.step-head .n{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:16px}
.step-head .label{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-head .say{color:var(--muted);font-weight:400;font-size:13px}
.kind{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;
  border-radius:999px;padding:2px 9px;background:#E9EBE5;color:var(--muted)}
.kind.question{background:var(--bubble);color:var(--green-dark)}
.kind.message{background:#E4EDF6;color:#2A5C8C}
.kind.condition{background:#FBF0DC;color:var(--amber)}
.kind.end{background:var(--ink);color:var(--paper)}
.step-head .icon{border:none;background:none;cursor:pointer;color:var(--muted);font-size:14px;padding:2px 5px;
  border-radius:6px;line-height:1}
.step-head .icon:hover{background:#EFF2ED;color:var(--ink)}
.start-flag{font-family:var(--mono);font-size:10px;color:var(--green-dark);letter-spacing:.06em}

.step-body{border-top:1px solid var(--line);padding:14px;display:grid;gap:12px}
.field{display:grid;gap:5px}
.field > label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input,.field select,.field textarea{font-family:var(--body);font-size:14px;color:var(--ink);
  background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 11px;width:100%}
.field textarea{resize:vertical;min-height:62px;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--bubble);border-color:var(--green)}
.field .hint{font-size:12px;color:var(--muted);line-height:1.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:760px){.row2,.row3{grid-template-columns:1fr}}

.modes{display:flex;gap:8px;flex-wrap:wrap}
.mode{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;
  background:var(--paper);transition:.15s ease}
.mode.on{border-color:var(--green);background:var(--bubble)}
.mode b{display:block;font-size:13.5px}
.mode span{font-size:12px;color:var(--muted);line-height:1.4}

.rules{display:grid;gap:7px}
.rule{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rule select,.rule input{font-family:var(--body);font-size:13px;padding:6px 9px;border:1px solid var(--line);
  border-radius:8px;background:var(--paper);color:var(--ink);min-width:0}
.rule .k{flex:1 1 110px}.rule .op{flex:0 1 130px}.rule .v{flex:1 1 100px}.rule .to{flex:1 1 130px}
.rule .arrow{font-family:var(--mono);font-size:12px;color:var(--muted)}
.rule .x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 5px}
.rule .x:hover{color:#8C2F2F}
.addbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-top:1px solid var(--line)}

/* the simulator */
.sim{padding:14px;height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;background:#F1F3EE}
.sim .b{max-width:82%;padding:9px 13px;border-radius:13px;font-size:14.5px;white-space:pre-wrap;line-height:1.5}
.sim .b.in{align-self:flex-end;background:var(--bubble);border-bottom-right-radius:4px}
.sim .b.out{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.sim .trace{align-self:flex-start;font-family:var(--mono);font-size:10.5px;color:var(--muted);
  letter-spacing:.03em;padding:0 4px 4px}
.sim .trace b{font-weight:500;color:var(--green-dark)}
.simform{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.simform input{flex:1;font-family:var(--body);font-size:14px;border:1px solid var(--line);border-radius:999px;
  padding:9px 15px;background:var(--paper);color:var(--ink)}
.simform input:focus{outline:2px solid var(--bubble);border-color:var(--green)}
.switch{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.answers{padding:11px 14px;border-top:1px solid var(--line);display:flex;gap:7px;flex-wrap:wrap;font-size:12.5px}
.answers .a{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 11px}
.answers .a b{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
</style>
</head>
<body>

<header>
  <div class="wrap head-inner">
    <a class="logo" href="#"><span class="dot"></span>247clerk<span class="tag">Admin</span></a>
    <div class="head-actions">
      <a id="csv" href="#">Export CSV</a>
      <span class="live"><span class="pulse"></span><span id="live-label">Live</span></span>
    </div>
  </div>
</header>

<main class="wrap">

  <div class="stats" id="stats"></div>

  <div class="tabs">
    <button class="tab on" data-tab="people" id="tab-people">People</button>
    <button class="tab" data-tab="unclaimed" id="tab-unclaimed">Unused links</button>
    <button class="tab" data-tab="visitors" id="tab-visitors">Visitors</button>
    <button class="tab" data-tab="flow" id="tab-flow">Conversation</button>
    <input class="search" id="search" type="search" placeholder="Search name, number, email…" autocomplete="off">
  </div>

  <!-- ================= people ================= -->
  <section id="view-people">
    <div class="split">
      <div class="panel">
        <div class="panel-head"><h2>Everyone who tried it</h2><span class="meta" id="people-count">—</span></div>
        <div class="people" id="people"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2 id="detail-title">Details</h2><span class="meta" id="detail-meta"></span></div>
        <div class="detail" id="detail"><p class="empty">Pick someone on the left to see their conversation.</p></div>
      </div>
    </div>
  </section>

  <!-- ================= unclaimed ================= -->
  <section id="view-unclaimed" class="hidden">
    <div class="panel">
      <div class="panel-head">
        <h2>Links issued that never got a message</h2><span class="meta" id="unclaimed-count">—</span>
      </div>
      <div class="scroll-x"><table id="unclaimed"></table></div>
    </div>
  </section>

  <!-- ================= visitors ================= -->
  <section id="view-visitors" class="hidden">
    <div class="panel">
      <div class="panel-head">
        <h2>Everyone who landed on the page</h2><span class="meta" id="visitors-count">—</span>
      </div>
      <div class="scroll-x"><table id="visitors"></table></div>
    </div>
    <div class="panel hidden" id="visitor-panel" style="margin-top:18px">
      <div class="panel-head"><h2 id="visitor-title">Visitor</h2><span class="meta" id="visitor-meta"></span></div>
      <div class="detail" id="visitor-detail"></div>
    </div>
  </section>

  <!-- ================= flow ================= -->
  <section id="view-flow" class="hidden">
    <div class="flowbar">
      <select id="flow-tenant" title="Which number's conversation you're editing"></select>
      <span class="src-pill" id="flow-source">—</span>
      <input id="flow-name" placeholder="Name this flow" autocomplete="off">
      <label class="switch" title="Where to go when someone says they're not interested">
        Not interested →
        <select id="flow-decline"></select>
      </label>
      <span class="grow"></span>
      <select id="flow-revisions" title="Earlier saved versions"><option value="">History…</option></select>
      <button class="btn" id="flow-default">Reset to default</button>
      <button class="btn primary" id="flow-save">Save</button>
    </div>

    <div class="problems ok hidden" id="flow-problems"></div>

    <div class="split">
      <div class="panel">
        <div class="panel-head">
          <h2>The conversation</h2><span class="meta" id="flow-meta">—</span>
        </div>
        <div class="steps" id="flow-steps"></div>
        <div class="addbar">
          <button class="btn tiny" data-add="question">+ Question</button>
          <button class="btn tiny" data-add="message">+ Message</button>
          <button class="btn tiny" data-add="condition">+ Condition</button>
          <button class="btn tiny" data-add="end">+ End</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Try it</h2>
          <label class="switch" title="Off runs the flow with no model at all — what happens if Gemini is down">
            <input type="checkbox" id="sim-ai" checked> AI reading
          </label>
        </div>
        <div class="sim" id="sim-log"></div>
        <div class="answers" id="sim-answers"></div>
        <form class="simform" id="sim-form">
          <input id="sim-input" placeholder="Message it the way a client would…" autocomplete="off">
          <button class="btn primary" type="submit" id="sim-send">Send</button>
          <button class="btn" type="button" id="sim-reset">Restart</button>
        </form>
      </div>
    </div>
  </section>

</main>

<script>
const BASE = '/admin/' + location.pathname.split('/')[2];
const el = (id) => document.getElementById(id);

// Flows collect whatever the owner asks for, so answer labels are derived from
// the key. These are the few that read badly when they are.
const LABELS = { matter_type: 'Matter type', wa_id: 'WhatsApp number', email: 'Email' };
const VERDICTS = { qualified: 'Qualified', unqualified: 'Not qualified', needs_info: 'Collecting',
                   handoff: 'Needs a person' };

const labelFor = (key) => LABELS[key] ||
  key.replace(/[_-]+/g, ' ').replace(/^./, (c) => c.toUpperCase());

let people = [];
let unclaimed = [];
let visitors = [];
let selectedId = null;
let filter = '';
let tab = 'people';

const esc = (value) => String(value ?? '').replace(/[<>&"]/g, (c) => (
  { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]
));

function when(value) {
  if (!value) return '—';
  const then = new Date(value), mins = Math.round((Date.now() - then) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  if (mins < 1440) return Math.round(mins / 60) + 'h ago';
  if (mins < 20160) return Math.round(mins / 1440) + 'd ago';
  return then.toLocaleDateString();
}
const stamp = (value) => (value ? new Date(value).toLocaleString() : '');
const clock = (value) => new Date(value).toLocaleString([], {
  month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
});

function nameOf(person) {
  const slots = (person && person.extracted) || {};
  // The name they typed to the clerk beats the one WhatsApp shows.
  return person.contact_name || slots.contact_name || person.profile_name || person.company_name || 'Unknown';
}

/* ------------------------------------------------------------------- list */

function matches(person) {
  if (!filter) return true;
  return [person.wa_id, person.profile_name, person.contact_name, person.company_name,
          person.email, person.source, person.matter_type, person.token]
    .filter(Boolean).join(' ').toLowerCase().includes(filter);
}

}

function renderPeople() {

function place(row) {
  return [row.city, row.region && row.region !== row.city ? row.region : null, row.country]
    .filter(Boolean).join(', ') || '—';
}

function machine(row) {
  const browser = [row.browser, row.browser_version ? String(row.browser_version).split('.')[0] : null]
    .filter(Boolean).join(' ');
  return [browser || null, row.os, row.device].filter(Boolean).join(' · ') || '—';
}

function outcome(visitor) {
  if (visitor.messaged) return ['qualified', 'messaged'];
  if (visitor.wa_clicks > 0) return ['needs_info', 'opened WhatsApp'];
  if (visitor.reached_start || visitor.cta_clicks > 0) return ['needs_info', 'got the link'];
  return ['none', 'just looked'];
}

async function inspect(vid) {

  el('visitor-detail').innerHTML = data.visits.map(visitCard).join('');
}

/** One tracked event, with everything the browser and the lookup gave us. */
function visitCard(visit) {
  const client = visit.client || {};
  const utm = visit.utm || {};
  return `<div class="convo" style="margin-bottom:14px">
    <div class="convo-head">
      <span>${esc(clock(visit.created_at))} · ${esc(visit.kind)}${
        visit.source ? ' · ' + esc(visit.source) : ''}${visit.token ? ' · ' + esc(visit.token) : ''}</span>
      <span>${esc(machine(visit))}</span>
    </div>
    <div style="padding:16px">
      <div class="facts" style="margin:0;border-top:none;padding-top:0">
        ${fact('IP (ours)', visit.ip)}
        ${fact('IP (ipify)', visit.client_ip)}
        ${fact('Location', place(visit) === '—' ? null : place(visit))}
        ${fact('ISP', visit.isp)}
        ${fact('Browser', [visit.browser, visit.browser_version].filter(Boolean).join(' '))}
        ${fact('OS', visit.os)}
        ${fact('Device', visit.device)}
        ${fact('Screen', visit.screen)}
        ${fact('Viewport', client.viewport)}
        ${fact('Timezone', visit.timezone || visit.ip_timezone)}
        ${fact('Language', visit.language)}
        ${fact('CPU cores', client.cpuCores)}
        ${fact('Memory (GB)', client.deviceMemory)}
        ${fact('Connection', client.connection && client.connection.type)}
        ${fact('Referrer', visit.referrer)}
        ${fact('Page', visit.page_url)}
        ${fact('Campaign', Object.keys(utm).length ? JSON.stringify(utm) : null)}
        ${fact('Seconds on page', client.secondsOnPage)}
      </div>
      <details><summary>Raw browser payload</summary><pre>${esc(JSON.stringify(client, null, 2))}</pre></details>
      <details><summary>Request headers</summary><pre>${esc(JSON.stringify(visit.headers || {}, null, 2))}</pre></details>
      <details><summary>Geo lookup</summary><pre>${esc(JSON.stringify(visit.geo || {}, null, 2))}</pre></details>
    </div>
  </div>`;
}

/* ----------------------------------------------------------------- detail */

function fact(label, value) {
  const empty = value === null || value === undefined || value === '';
  return `<div class="fact"><span class="label">${label}</span>
    <span class="value ${empty ? 'empty' : ''}">${esc(empty ? 'not given' : value)}</span></div>`;
}

async function select(id, silent) {
  selectedId = id;
  if (!silent) {
    renderPeople();
    el('detail').innerHTML = '<p class="empty">Loading…</p>';
  }

  const data = await fetch(BASE + '/people/' + id).then((r) => r.json()).catch(() => null);
  if (selectedId !== id) return;
  if (!data || data.error) {
    if (!silent) el('detail').innerHTML = '<p class="empty">Could not load that person.</p>';
    return;
  }

  // A background refresh must not yank the page out from under whoever is reading it.
  const scroll = el('detail').scrollTop;
  const open = [...el('detail').querySelectorAll('details[open]')].length;
  renderDetail(data);
  if (silent) {
    el('detail').scrollTop = scroll;
    const sections = el('detail').querySelectorAll('details');
    for (let i = 0; i < open && i < sections.length; i++) sections[i].open = true;
  }
}

      ${fact('Messages sent', contact.message_count)}

      ${fact('ISP', person.isp)}

              esc(m.body || '[' + m.type + ']')}<time>${esc(clock(m.created_at))}${
              m.status && m.status !== 'sent' ? ' · ' + esc(m.status) : ''}</time></div>`).join('')
          : '<p class="empty">No messages in this conversation.</p>'}</div>

  const history = qualifications.length
    ? `<div class="scroll-x"><table>
        <thead><tr><th>When</th><th>Verdict</th><th>Matter</th><th>Answered</th><th>Model</th></tr></thead>
        <tbody>${qualifications.map((q) => `<tr>

/* ========================== the conversation builder ========================== */
/* The flow the clerk follows, edited as an ordered list of steps. The first
   step is always where a conversation starts; everything else is reached by
   falling through to the next step or by a rule that jumps somewhere else. */

const FIELDS = [
  ['text', 'Short text'], ['longtext', 'Long text'], ['choice', 'Pick from a list'],
  ['email', 'Email address'], ['phone', 'Phone number'], ['number', 'Number'], ['date', 'Date'],
];
const OPS = [
  ['is', 'is'], ['is_not', 'is not'], ['contains', 'contains'], ['not_contains', "doesn't contain"],
  ['gt', 'is more than'], ['lt', 'is less than'], ['answered', 'was answered'], ['empty', 'was left blank'],
];
const OUTCOMES = [
  ['qualified', 'Qualified — worth a call back'],
  ['unqualified', 'Not a fit'],
  ['handoff', 'Needs a person now'],
];
const KINDS = { question: 'question', message: 'message', condition: 'condition', end: 'end' };

let tenants = [];
let tenantId = null;
let flow = null;
let flowSource = 'default';
let revisions = [];
let expanded = new Set();
let dirty = false;
let simMessages = [];
let simTurns = [];
let simBusy = false;
let flowOpened = false;

/* ------------------------------------------------------------------ loading */

async function openFlowTab() {
  if (flowOpened) return;
  flowOpened = true;

  const data = await fetch(BASE + '/tenants').then((r) => r.json()).catch(() => null);
  tenants = (data && data.tenants) || [];
  el('flow-tenant').innerHTML = tenants.map((tenant) =>
    `<option value="${esc(tenant.id)}">${esc(tenant.name)}${tenant.isDemo ? ' · demo' : ''}</option>`
  ).join('');
  if (tenants.length) await loadFlow(tenants[0].id);
}

async function loadFlow(id) {
  const data = await fetch(BASE + '/tenants/' + id + '/flow').then((r) => r.json()).catch(() => null);
  if (!data || data.error) { note('error', ['Could not load that flow.']); return; }

  tenantId = id;
  flow = data.flow;
  flowSource = data.source;
  revisions = data.revisions || [];
  expanded = new Set();
  dirty = false;
  resetSim();
  renderFlow();

  if (flowSource === 'legacy') {
    note('warn', ['This number is still running the old three-question config. ' +
                  'It has been read in below — save once and it becomes a proper flow.']);
  } else if (flowSource === 'default') {
    note('warn', ['This number has never had a flow of its own, so it runs the built-in default. ' +
                  'Edit it below and save to make it yours.']);
  } else {
    hideNote();
  }
}

/* ---------------------------------------------------------------- rendering */

const labelOf = (step) => step.label || (step.type === 'question' ? step.key : step.type);

function summaryOf(step) {
  if (step.type === 'question') return step.ask;
  if (step.type === 'message' || step.type === 'end') return step.text;
  return step.branches.length + (step.branches.length === 1 ? ' rule' : ' rules');
}

function renderFlow() {
  if (!flow) return;
  el('flow-name').value = flow.name || '';
  el('flow-source').textContent = { flow: 'saved flow', legacy: 'old config', default: 'default' }[flowSource];
  el('flow-source').className = 'src-pill ' + flowSource;

  const questions = flow.steps.filter((step) => step.type === 'question').length;
  el('flow-meta').textContent =
    flow.steps.length + ' steps · ' + questions + (questions === 1 ? ' question' : ' questions') +
    (dirty ? ' · unsaved' : '');

  el('flow-decline').innerHTML = '<option value="">stop politely</option>' + flow.steps
    .filter((step) => step.type === 'end')
    .map((step) => `<option value="${esc(step.id)}"${step.id === flow.onDecline ? ' selected' : ''}>${
      esc(labelOf(step))}</option>`).join('');

  el('flow-revisions').innerHTML = '<option value="">History…</option>' + revisions.map((rev) =>
    `<option value="${esc(rev.id)}">${esc(clock(rev.created_at))}${rev.note ? ' · ' + esc(rev.note) : ''}</option>`
  ).join('');

  el('flow-steps').innerHTML = flow.steps.length
    ? flow.steps.map(stepCard).join('')
    : '<p class="empty">No steps yet. Add a question below to start the conversation.</p>';
}

function stepCard(step, index) {
  const open = expanded.has(step.id);
  return `<div class="step" data-id="${esc(step.id)}" draggable="true">
    <div class="step-head" data-act="toggle">
      <span class="grip" title="Drag to reorder">⠿</span>
      <span class="n">${index + 1}</span>
      <span class="label">${esc(labelOf(step))} <span class="say">— ${esc(clip(summaryOf(step)))}</span></span>
      ${index === 0 ? '<span class="start-flag">STARTS HERE</span>' : ''}
      <span class="kind ${esc(step.type)}">${esc(KINDS[step.type] || step.type)}</span>
      <button class="icon" data-act="up" title="Move up">↑</button>
      <button class="icon" data-act="down" title="Move down">↓</button>
      <button class="icon" data-act="delete" title="Delete step">✕</button>
      <button class="icon" data-act="toggle">${open ? '⌃' : '⌄'}</button>
    </div>
    ${open ? `<div class="step-body">${stepBody(step, index)}</div>` : ''}
  </div>`;
}

function stepBody(step, index) {
  const label = field('Step name', `<input data-path="label" value="${esc(step.label)}">`);
  const after = index === flow.steps.length - 1 ? 'end the conversation' : 'the next step below';

  if (step.type === 'message') {
    return label +
      field('Say this', `<textarea data-path="text">${esc(step.text)}</textarea>`,
            'Nothing is asked and nothing is stored — it just gets sent. ' + TEMPLATE_HINT) +
      field('Then', gotoSelect('next', step.next, step.id, after));
  }

  if (step.type === 'end') {
    return label +
      field('Verdict', select('outcome', OUTCOMES, step.outcome)) +
      field('Final message', `<textarea data-path="text">${esc(step.text)}</textarea>`, TEMPLATE_HINT) +
      field('Booking link (optional)',
            `<input data-path="bookingUrl" placeholder="https://cal.com/…" value="${esc(step.bookingUrl || '')}">`,
            'Added to the last message so a qualified lead can book there and then.');
  }

  if (step.type === 'condition') {
    return label +
      field('Branch on the answers so far', rules(step.branches, 'branches', step.id, true) +
        `<button class="btn tiny" data-act="add-branch">+ Rule</button>`,
        'Checked top to bottom; the first rule that fits wins.') +
      field('If none of them fit', gotoSelect('otherwise', step.otherwise, step.id, after));
  }

  const isChoice = step.field === 'choice';
  const isStrict = step.mode === 'strict';

  return label +
    field('Ask', `<textarea data-path="ask">${esc(step.ask)}</textarea>`, TEMPLATE_HINT) +
    `<div class="row2">
      ${field('Save the answer as', `<input data-path="key" value="${esc(step.key)}">`,
              'The column it appears under on a lead, and the name rules use.')}
      ${field('Answer type', select('field', FIELDS, step.field))}
    </div>` +
    field('How it listens', `<div class="modes">
      <label class="mode ${isStrict ? '' : 'on'}">
        <input type="radio" name="mode-${esc(step.id)}" data-path="mode" value="ai" ${isStrict ? '' : 'checked'} hidden>
        <b>Let the AI read it</b>
        <span>Asked in your words, but the answer is understood however it's written — including facts
        volunteered earlier, which skips questions already answered.</span>
      </label>
      <label class="mode ${isStrict ? 'on' : ''}">
        <input type="radio" name="mode-${esc(step.id)}" data-path="mode" value="strict" ${isStrict ? 'checked' : ''} hidden>
        <b>Ask exactly this</b>
        <span>Sent word for word and checked locally. No model, so it is predictable and free — but it
        only ever hears the reply to this one question.</span>
      </label>
    </div>`) +
    (isChoice ? field('Options', options(step) +
        `<button class="btn tiny" data-act="add-option">+ Option</button>`,
        'Sent as a numbered list. Replying with the number or the words both work.') : '') +
    `<div class="row3">
      ${field('Required', `<select data-path="required">
        <option value="yes"${step.required ? ' selected' : ''}>Must be answered</option>
        <option value="no"${step.required ? '' : ' selected'}>Can be skipped</option></select>`)}
      ${step.field === 'number'
        ? field('Smallest', `<input data-path="min" type="number" value="${esc(step.min ?? '')}">`) +
          field('Largest', `<input data-path="max" type="number" value="${esc(step.max ?? '')}">`)
        : ''}
    </div>` +
    (isStrict ? field('If the answer does not fit',
        `<input data-path="invalidMessage" placeholder="Sorry, I didn't catch that." value="${
          esc(step.invalidMessage || '')}">`,
        'Sent in front of the question when it is asked again. After three tries the flow moves on anyway.') : '') +
    field('Then', gotoSelect('next', step.next, step.id, after)) +
    field('Unless…', rules(step.jumps, 'jumps', step.id, true) +
      `<button class="btn tiny" data-act="add-jump">+ Rule</button>`,
      'Jump somewhere else depending on what they answered.');
}

const TEMPLATE_HINT = 'Use {{key}} to drop in an answer, and {{#key}}…{{/key}} to keep words only when ' +
  'that answer exists. {{name}} and {{tenant}} always work.';

function field(label, control, hint) {
  return `<div class="field"><label>${esc(label)}</label>${control}${
    hint ? `<span class="hint">${esc(hint)}</span>` : ''}</div>`;
}

function select(path, pairs, value) {
  return `<select data-path="${esc(path)}">${pairs.map(([key, label]) =>
    `<option value="${esc(key)}"${key === value ? ' selected' : ''}>${esc(label)}</option>`).join('')}</select>`;
}

function gotoSelect(path, value, selfId, fallback) {
  const options = flow.steps
    .filter((step) => step.id !== selfId)
    .map((step, i) => `<option value="${esc(step.id)}"${step.id === value ? ' selected' : ''}>${
      esc((flow.steps.findIndex((s) => s.id === step.id) + 1) + '. ' + labelOf(step))}</option>`);
  return `<select data-path="${esc(path)}"><option value=""${value ? '' : ' selected'}>↓ ${
    esc(fallback)}</option>${options.join('')}</select>`;
}

function options(step) {
  return '<div class="rules">' + step.options.map((option, i) => `<div class="rule">
    <input class="k" data-path="options.${i}.label" value="${esc(option.label)}" placeholder="What they see">
    <span class="arrow">→</span>
    ${gotoSelect(`options.${i}.next`, option.next, step.id, 'carry on')}
    <button class="x" data-act="delete-option" data-arg="${i}" title="Remove">✕</button>
  </div>`).join('') + '</div>';
}

/** One jump or branch: a set of clauses, and where it goes when they hold. */
function rules(list, path, selfId, showTo) {
  if (!list.length) return '<div class="rules"></div>';
  return '<div class="rules">' + list.map((rule, i) => {
    const clauses = rule.when.clauses;
    const rows = clauses.map((clause, j) => `<div class="rule">
      ${j === 0 ? '' : `<span class="arrow">${esc(rule.when.match === 'any' ? 'or' : 'and')}</span>`}
      ${keySelect(`${path}.${i}.when.clauses.${j}.key`, clause.key)}
      ${(() => { const sel = select(`${path}.${i}.when.clauses.${j}.op`, OPS, clause.op);
                 return sel.replace('<select', '<select class="op"'); })()}
      ${clause.op === 'answered' || clause.op === 'empty' ? '' :
        `<input class="v" data-path="${path}.${i}.when.clauses.${j}.value" value="${esc(clause.value)}"
          placeholder="value">`}
      <button class="x" data-act="delete-clause" data-arg="${path}.${i}.${j}" title="Remove">✕</button>
    </div>`).join('');

    return rows + `<div class="rule">
      <span class="arrow">then go to</span>
      ${gotoSelect(`${path}.${i}.to`, rule.to, selfId, 'carry on')}
      ${clauses.length > 1 ? select(`${path}.${i}.when.match`,
        [['all', 'all must hold'], ['any', 'any may hold']], rule.when.match) : ''}
      <button class="btn tiny" data-act="add-clause" data-arg="${path}.${i}">+ and</button>
      <button class="x" data-act="delete-rule" data-arg="${path}.${i}" title="Remove rule">✕</button>
    </div>`;
  }).join('') + '</div>';
}

function keySelect(path, value) {
  const keys = [...new Set(flow.steps.filter((s) => s.type === 'question').map((s) => s.key))];
  if (value && !keys.includes(value)) keys.push(value);
  return `<select class="k" data-path="${esc(path)}">${keys.map((key) =>
    `<option value="${esc(key)}"${key === value ? ' selected' : ''}>${esc(key)}</option>`).join('')}</select>`;
}

const clip = (text) => {
  const line = String(text || '').replace(/\s+/g, ' ').trim();
  return line.length > 70 ? line.slice(0, 69) + '…' : line;
};

/* ----------------------------------------------------------------- editing */

function stepOf(id) { return flow.steps.find((step) => step.id === id); }

/** Writes a dotted path — "options.1.next", "jumps.0.when.clauses.0.op". */
function setPath(target, path, value) {
  const parts = path.split('.');
  let node = target;
  for (const part of parts.slice(0, -1)) node = node[part];
  node[parts[parts.length - 1]] = value;
}

function readPath(target, path) {
  return path.split('.').reduce((node, part) => (node == null ? node : node[part]), target);
}

function touched() {
  dirty = true;
  const questions = flow.steps.filter((step) => step.type === 'question').length;
  el('flow-meta').textContent =
    flow.steps.length + ' steps · ' + questions + (questions === 1 ? ' question' : ' questions') + ' · unsaved';
}

function uniqueStepId(base) {
  let id = base, n = 2;
  while (flow.steps.some((step) => step.id === id)) id = base + n++;
  return id;
}

function blankStep(type) {
  const id = uniqueStepId(type === 'question' ? 'q' : type[0]);
  if (type === 'message') {
    return { id, type, label: 'Message', text: 'Thanks for getting in touch.', next: null };
  }
  if (type === 'condition') {
    return { id, type, label: 'Condition', branches: [], otherwise: null };
  }
  if (type === 'end') {
    return { id, type, label: 'Qualified', outcome: 'qualified',
             text: "Thanks — I've logged that and someone will come back to you.", bookingUrl: null };
  }
  const key = uniqueKey();
  return { id, type: 'question', label: 'New question', key, ask: '', field: 'text', mode: 'ai',
           options: [], required: true, pattern: null, invalidMessage: null, min: null, max: null,
           jumps: [], next: null };
}

function uniqueKey() {
  let n = 1;
  const taken = new Set(flow.steps.filter((s) => s.type === 'question').map((s) => s.key));
  while (taken.has('answer_' + n)) n++;
  return 'answer_' + n;
}

function blankRule() {
  const first = flow.steps.find((step) => step.type === 'question');
  return { when: { match: 'all', clauses: [{ key: first ? first.key : '', op: 'is', value: '' }] }, to: null };
}

/* Text and number inputs: mutate in place, never re-render — a re-render here
   would take the caret out from under whoever is typing. */
el('flow-steps').addEventListener('input', (event) => {
  const input = event.target.closest('[data-path]');
  if (!input || input.tagName === 'SELECT') return;
  const card = input.closest('.step');
  const step = stepOf(card.dataset.id);
  if (!step) return;

  let value = input.value;
  if (input.type === 'number') value = value === '' ? null : Number(value);
  else if (['bookingUrl', 'invalidMessage'].includes(input.dataset.path)) value = value.trim() || null;
  setPath(step, input.dataset.path, value);

  const head = card.querySelector('.step-head .label');
  if (head) {
    head.innerHTML = esc(labelOf(step)) + ' <span class="say">— ' + esc(clip(summaryOf(step))) + '</span>';
  }
  touched();
});

/* Selects and radios: some of them change what the form should show. */
el('flow-steps').addEventListener('change', (event) => {
  const input = event.target.closest('[data-path]');
  if (!input) return;
  const card = input.closest('.step');
  const step = stepOf(card.dataset.id);
  if (!step) return;

  const path = input.dataset.path;
  let value = input.value;
  if (path === 'next' || path === 'otherwise' || path.endsWith('.next') || path.endsWith('.to')) {
    value = value || null;
  } else if (path === 'required') {
    value = value === 'yes';
  } else if (input.type === 'number') {
    value = value === '' ? null : Number(value);
  }
  setPath(step, path, value);

  // Switching to a list needs somewhere to put the options; leaving one keeps
  // them, in case it was a slip.
  if (path === 'field' && value === 'choice' && step.options.length === 0) {
    step.options = [{ label: 'Yes', value: 'Yes', next: null }, { label: 'No', value: 'No', next: null }];
  }
  touched();

  // Anything that changes the shape of the form, or of another form, redraws.
  if (['field', 'mode', 'key', 'required', 'outcome'].includes(path) || path.endsWith('.op')) renderFlow();
});

el('flow-steps').addEventListener('click', (event) => {
  const button = event.target.closest('[data-act]');
  if (!button) return;
  const card = button.closest('.step');
  const step = stepOf(card.dataset.id);
  if (!step) return;
  const act = button.dataset.act;
  const arg = button.dataset.arg;
  const index = flow.steps.indexOf(step);

  if (act === 'toggle') {
    if (event.target.closest('[data-act]') !== button && event.target.closest('input,select,textarea')) return;
    expanded.has(step.id) ? expanded.delete(step.id) : expanded.add(step.id);
    renderFlow();
    return;
  }
  if (act === 'up' || act === 'down') {
    const to = act === 'up' ? index - 1 : index + 1;
    if (to < 0 || to >= flow.steps.length) return;
    flow.steps.splice(to, 0, flow.steps.splice(index, 1)[0]);
  } else if (act === 'delete') {
    if (!confirm('Delete "' + labelOf(step) + '"? Anything pointing at it will fall through instead.')) return;
    flow.steps.splice(index, 1);
    for (const other of flow.steps) clearLinks(other, step.id);
    if (flow.onDecline === step.id) flow.onDecline = null;
  } else if (act === 'add-option') {
    step.options.push({ label: '', value: '', next: null });
  } else if (act === 'delete-option') {
    step.options.splice(Number(arg), 1);
  } else if (act === 'add-jump' || act === 'add-branch') {
    (act === 'add-jump' ? step.jumps : step.branches).push(blankRule());
  } else if (act === 'delete-rule') {
    const [list, i] = arg.split('.');
    step[list].splice(Number(i), 1);
  } else if (act === 'add-clause') {
    const [list, i] = arg.split('.');
    const first = flow.steps.find((s) => s.type === 'question');
    step[list][Number(i)].when.clauses.push({ key: first ? first.key : '', op: 'is', value: '' });
  } else if (act === 'delete-clause') {
    const [list, i, j] = arg.split('.');
    const clauses = step[list][Number(i)].when.clauses;
    if (clauses.length > 1) clauses.splice(Number(j), 1);
  } else {
    return;
  }
  touched();
  renderFlow();
});

/** Drops every reference to a step that has just been deleted. */
function clearLinks(step, goneId) {
  if (step.next === goneId) step.next = null;
  if (step.otherwise === goneId) step.otherwise = null;
  for (const list of ['jumps', 'branches']) {
    if (Array.isArray(step[list])) step[list] = step[list].filter((rule) => rule.to !== goneId);
  }
  for (const option of step.options || []) if (option.next === goneId) option.next = null;
}

/* --------------------------------------------------------------- reordering */

let dragId = null;

el('flow-steps').addEventListener('dragstart', (event) => {
  const card = event.target.closest('.step');
  if (!card) return;
  dragId = card.dataset.id;
  card.classList.add('dragging');
  event.dataTransfer.effectAllowed = 'move';
});

el('flow-steps').addEventListener('dragend', () => {
  dragId = null;
  for (const card of el('flow-steps').querySelectorAll('.step')) {
    card.classList.remove('dragging', 'drop-before');
  }
});

el('flow-steps').addEventListener('dragover', (event) => {
  if (!dragId) return;
  event.preventDefault();
  const card = event.target.closest('.step');
  for (const other of el('flow-steps').querySelectorAll('.step')) other.classList.remove('drop-before');
  if (card && card.dataset.id !== dragId) card.classList.add('drop-before');
});

el('flow-steps').addEventListener('drop', (event) => {
  if (!dragId) return;
  event.preventDefault();
  const card = event.target.closest('.step');
  const from = flow.steps.findIndex((step) => step.id === dragId);
  const to = card ? flow.steps.findIndex((step) => step.id === card.dataset.id) : flow.steps.length - 1;
  dragId = null;
  if (from < 0 || to < 0 || from === to) { renderFlow(); return; }
  flow.steps.splice(to, 0, flow.steps.splice(from, 1)[0]);
  touched();
  renderFlow();
});

/* -------------------------------------------------------------- the toolbar */

for (const button of document.querySelectorAll('[data-add]')) {
  button.addEventListener('click', () => {
    if (!flow) return;
    const step = blankStep(button.dataset.add);
    flow.steps.push(step);
    expanded.add(step.id);
    touched();
    renderFlow();
    el('flow-steps').querySelector(`.step[data-id="${step.id}"]`)
      ?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
}

el('flow-tenant').addEventListener('change', async (event) => {
  if (dirty && !confirm('You have unsaved changes. Discard them?')) {
    event.target.value = tenantId;
    return;
  }
  await loadFlow(event.target.value);
});

el('flow-name').addEventListener('input', (event) => { flow.name = event.target.value; touched(); });
el('flow-decline').addEventListener('change', (event) => { flow.onDecline = event.target.value || null; touched(); });

el('flow-save').addEventListener('click', async () => {
  if (!flow || !tenantId) return;
  // The list is the flow: whatever sits at the top is where a conversation starts.
  flow.start = flow.steps.length ? flow.steps[0].id : null;

  el('flow-save').disabled = true;
  try {
    const response = await fetch(BASE + '/tenants/' + tenantId + '/flow', {
      method: 'PUT',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ flow, note: null }),
    });
    const data = await response.json();

    if (!response.ok) {
      note('error', (data.problems || []).filter((p) => p.level === 'error').map((p) => p.message),
           'Not saved — fix these first:');
      return;
    }
    flow = data.flow;
    flowSource = 'flow';
    dirty = false;
    const warnings = (data.problems || []).filter((p) => p.level === 'warning').map((p) => p.message);
    note(warnings.length ? 'warn' : 'ok',
         warnings, warnings.length ? 'Saved, but worth a look:' : 'Saved. It is live on the next message.');
    await refreshRevisions();
    renderFlow();
  } catch (error) {
    note('error', ['Could not reach the server.']);
  } finally {
    el('flow-save').disabled = false;
  }
});

el('flow-default').addEventListener('click', async () => {
  if (!tenantId) return;
  if (!confirm('Replace this flow with the built-in default? The current one stays in history.')) return;
  const data = await fetch(BASE + '/tenants/' + tenantId + '/flow/reset', { method: 'POST' })
    .then((r) => r.json()).catch(() => null);
  if (!data || !data.ok) { note('error', ['Could not reset that flow.']); return; }
  flow = data.flow;
  flowSource = 'flow';
  dirty = false;
  expanded = new Set();
  await refreshRevisions();
  renderFlow();
  note('ok', [], 'Back to the default three questions.');
});

el('flow-revisions').addEventListener('change', async (event) => {
  const id = event.target.value;
  event.target.value = '';
  if (!id) return;
  if (!confirm('Restore that version? The current one is kept in history.')) return;

  const data = await fetch(BASE + '/tenants/' + tenantId + '/flow/revisions/' + id + '/restore',
                           { method: 'POST' }).then((r) => r.json()).catch(() => null);
  if (!data || !data.ok) { note('error', ['Could not restore that version.']); return; }
  flow = data.flow;
  flowSource = 'flow';
  dirty = false;
  expanded = new Set();
  await refreshRevisions();
  renderFlow();
  note('ok', [], 'Restored.');
});

async function refreshRevisions() {
  const data = await fetch(BASE + '/tenants/' + tenantId + '/flow').then((r) => r.json()).catch(() => null);
  revisions = (data && data.revisions) || revisions;
}

function note(tone, lines, headline) {
  const box = el('flow-problems');
  box.className = 'problems ' + tone;
  box.innerHTML = (headline ? `<strong>${esc(headline)}</strong>` : '') +
    (lines.length ? '<ul>' + lines.map((line) => `<li>${esc(line)}</li>`).join('') + '</ul>' : '');
  box.classList.remove('hidden');
}
function hideNote() { el('flow-problems').classList.add('hidden'); }

/* --------------------------------------------------------------- simulator */

function resetSim() {
  simMessages = [];
  simTurns = [];
  renderSim();
}

function renderSim() {
  if (!simTurns.length) {
    el('sim-log').innerHTML = '<p class="empty">Send a message to walk the flow as it stands — ' +
      'including the changes you have not saved.</p>';
    el('sim-answers').innerHTML = '';
    return;
  }
  el('sim-log').innerHTML = simTurns.map((turn) => {
    const trace = (turn.trace || []).map((id) => {
      const step = flow.steps.find((s) => s.id === id);
      return esc(step ? labelOf(step) : id);
    });
    return `<div class="b in">${esc(turn.in)}</div>
      <div class="b out">${esc(turn.out)}</div>
      <div class="trace">${trace.length ? trace.join(' → ') : '—'} · <b>${esc(turn.verdict)}</b>${
        turn.model ? ' · ai' : ''}</div>`;
  }).join('') + (simBusy ? '<div class="trace">thinking…</div>' : '');
  el('sim-log').scrollTop = el('sim-log').scrollHeight;

  const answers = simTurns[simTurns.length - 1].answers || {};
  el('sim-answers').innerHTML = Object.keys(answers).length
    ? Object.entries(answers).map(([key, value]) =>
        `<span class="a"><b>${esc(key)}</b> ${esc(value)}</span>`).join('')
    : '<span class="hint">Nothing collected yet.</span>';
}

el('sim-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const input = el('sim-input');
  const message = input.value.trim();
  if (!message || simBusy || !flow) return;

  input.value = '';
  simMessages.push(message);
  simBusy = true;
  el('sim-send').disabled = true;
  // The whole conversation is replayed each time, so the run always reflects
  // the flow as it is right now rather than as it was three messages ago.
  simTurns = simTurns.concat([{ in: message, out: '…', trace: [], verdict: '', answers: {} }]);
  renderSim();

  try {
    const data = await fetch(BASE + '/flow/test', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        flow, messages: simMessages, useModel: el('sim-ai').checked,
        tenantName: (tenants.find((t) => t.id === tenantId) || {}).name || 'your firm',
      }),
    }).then((r) => r.json());
    simTurns = data.turns || [];
  } catch (error) {
    simMessages.pop();
    simTurns.pop();
    note('error', ['The simulator could not reach the server.']);
  } finally {
    simBusy = false;
    el('sim-send').disabled = false;
    renderSim();
  }
});

el('sim-reset').addEventListener('click', resetSim);
el('sim-ai').addEventListener('change', () => { if (simMessages.length) resetSim(); });

window.addEventListener('beforeunload', (event) => {
  if (dirty) { event.preventDefault(); event.returnValue = ''; }
});

async function refresh() {
  try {
    const data = await fetch(BASE + '/data').then((r) => r.json());
    people = data.people || [];
    unclaimed = data.unclaimed || [];
    visitors = data.visitors || [];
    renderStats(data.stats || {});
    renderPeople();
    renderUnclaimed();
    renderVisitors();
    el('live-label').textContent = 'Live';
  } catch (error) {
    el('live-label').textContent = 'Offline';
  }
}

refresh();
setInterval(refresh, 10000);
// Keep the open transcript current without stealing the reader's scroll.
setInterval(() => { if (selectedId && !document.hidden) select(selectedId, true); }, 15000);
</script>
</body>
</html>
